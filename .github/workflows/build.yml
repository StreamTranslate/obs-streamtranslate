name: Build OBS plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libobs-dev libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DST_STATIC_LIBWEBSOCKETS=ON
      - name: Build
        run: cmake --build build --verbose
      - name: Verify no shared libwebsockets dependency
        run: |
          bash tests/static-lws-checker.test.sh
          bash scripts/check-static-lws.sh build/obs-streamtranslate.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-linux
          path: |
            build/obs-streamtranslate.so
            LICENSE-libcaption.txt
            third-party/libwebsockets-LICENSE.txt

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config simde
      - name: Build pinned OpenSSL for macOS 14
        run: |
          mkdir -p build-deps
          cd build-deps
          curl -fL --retry 3 -O https://github.com/openssl/openssl/releases/download/openssl-3.6.4/openssl-3.6.4.tar.gz
          echo '9bffaa1ad1e07b354c21bd3324ec02fa15579f45a7d0494b3e74bc449b7333ef  openssl-3.6.4.tar.gz' | shasum -a 256 -c -
          tar -xzf openssl-3.6.4.tar.gz
          ssl_prefix="$PWD/openssl"
          cd openssl-3.6.4
          ./Configure darwin64-arm64-cc no-shared no-module no-tests --prefix="$ssl_prefix" -mmacosx-version-min=14.0
          make -j"$(sysctl -n hw.logicalcpu)" build_sw
          make install_sw
      - name: Fetch libobs headers
        run: git clone --depth 1 --branch 32.2.2 https://github.com/obsproject/obs-studio.git
      - name: Compile plugin bundle
        run: |
          mkdir -p dist/obs-streamtranslate.plugin/Contents/MacOS
          mkdir -p genhdr
          cat > genhdr/obsconfig.h << 'HDR'
          #pragma once
          #define OBS_VERSION "32.2.2"
          #define OBS_VERSION_CANONICAL "32.2.2"
          #define OBS_DATA_PATH "../../data"
          #define OBS_INSTALL_PREFIX ""
          #define OBS_PLUGIN_DESTINATION "obs-plugins"
          #define OBS_RELATIVE_PREFIX "../../"
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          HDR
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DST_MACOS_OBS_HEADERS="$PWD/obs-studio/libobs" -DST_MACOS_OBS_CONFIG="$PWD/genhdr" \
            -DST_MACOS_SIMDE_INCLUDE="$(brew --prefix simde)/include" \
            -DLWS_OPENSSL_INCLUDE_DIRS="$PWD/build-deps/openssl/include" \
            -DLWS_OPENSSL_LIBRARIES="$PWD/build-deps/openssl/lib/libssl.a;$PWD/build-deps/openssl/lib/libcrypto.a"
          cmake --build build-mac --parallel
          cp build-mac/obs-streamtranslate dist/obs-streamtranslate.plugin/Contents/MacOS/
          cat > dist/obs-streamtranslate.plugin/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>obs-streamtranslate</string>
            <key>CFBundleIdentifier</key><string>live.streamtranslate.obs-plugin</string>
            <key>CFBundleExecutable</key><string>obs-streamtranslate</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleVersion</key><string>0.1.15</string>
          </dict>
          </plist>
          PLIST
      - name: Bundle CA certificates and licenses
        run: |
          mkdir -p dist/obs-streamtranslate.plugin/Contents/Resources
          curl -fsSL -o dist/obs-streamtranslate.plugin/Contents/Resources/cacert.pem https://curl.se/ca/cacert.pem
          cp LICENSE-libcaption.txt third-party/libwebsockets-LICENSE.txt dist/obs-streamtranslate.plugin/Contents/Resources/
          cp build-deps/openssl-3.6.4/LICENSE.txt dist/obs-streamtranslate.plugin/Contents/Resources/LICENSE-OpenSSL.txt
      - name: Verify macOS compatibility and library linkage
        run: |
          bundle=dist/obs-streamtranslate.plugin
          BIN="$bundle/Contents/MacOS/obs-streamtranslate"
          test "$(lipo -archs "$BIN")" = arm64
          test "$(xcrun vtool -show-build "$BIN" | awk '/minos/{print $2}')" = 14.0
          otool -L "$BIN"
          otool -L "$BIN" | awk 'NR > 1 && $1 !~ /^\/(usr\/lib|System\/Library\/Frameworks)\// {exit 1}'
          codesign --force --sign - "$bundle"
          codesign --verify --strict "$bundle"
      - name: Build branded .pkg installer
        run: |
          # OBS on Apple Silicon ONLY scans ~/Library/Application Support/obs-studio/plugins
          # (the /Library system path is Intel-legacy, compiled out on arm64 — see
          # OBSBasic.cpp AddExtraModulePaths). Payload lands in a neutral spot and a
          # postinstall script copies it into the logged-in user's home plugins dir.
          mkdir -p "pkgroot/Library/Application Support/StreamTranslate" out pkg-scripts
          cp -R dist/obs-streamtranslate.plugin "pkgroot/Library/Application Support/StreamTranslate/"
          cat > pkg-scripts/postinstall << 'SCRIPT'
          #!/bin/bash
          loggedInUser=$(stat -f%Su /dev/console)
          [ -z "$loggedInUser" ] || [ "$loggedInUser" = "root" ] && loggedInUser=$(ls -l /dev/console | awk '{print $3}')
          userHome=$(dscl . -read "/Users/$loggedInUser" NFSHomeDirectory | awk '{print $2}')
          dest="$userHome/Library/Application Support/obs-studio/plugins"
          mkdir -p "$dest"
          rm -rf "$dest/obs-streamtranslate.plugin"
          cp -R "/Library/Application Support/StreamTranslate/obs-streamtranslate.plugin" "$dest/"
          chown -R "$loggedInUser" "$dest/obs-streamtranslate.plugin"
          exit 0
          SCRIPT
          chmod +x pkg-scripts/postinstall
          pkgbuild --root pkgroot \
            --identifier live.streamtranslate.obs-plugin \
            --version 0.1.15 \
            --scripts pkg-scripts \
            --install-location "/" \
            component.pkg
          productbuild --distribution installer/distribution.xml \
            --resources installer \
            --package-path . \
            out/StreamTranslate-OBS-Plugin.pkg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-macos-installer
          path: out/StreamTranslate-OBS-Plugin.pkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install libwebsockets (static)
        run: vcpkg install libwebsockets:x64-windows-static libuv:x64-windows-static zlib:x64-windows-static
        shell: cmd
      - name: Fetch libobs headers
        run: git clone --depth 1 --branch 31.0.3 https://github.com/obsproject/obs-studio.git
        shell: cmd
      - name: Select the portable OBS arithmetic path for clang-cl
        shell: pwsh
        run: |
          $header = 'obs-studio/libobs/util/util_uint64.h'
          $original = '#if defined(_MSC_VER) && defined(_M_X64) && (_MSC_VER >= 1920)'
          $source = Get-Content -Raw $header
          if (!$source.Contains($original)) { throw 'Expected OBS _udiv128 guard was not found' }
          $source.Replace($original, "$original && !defined(__clang__)") | Set-Content -NoNewline $header
      - name: Download OBS release (for obs.dll)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/31.0.3/OBS-Studio-31.0.3-Windows.zip" -OutFile obs-win.zip
          Expand-Archive obs-win.zip -DestinationPath obs-win
          Copy-Item obs-win/bin/64bit/obs.dll .
          Copy-Item obs-win/bin/64bit/w32-pthreads.dll .
      - name: Generate obs.lib import library
        shell: cmd
        run: |
          dumpbin /EXPORTS obs.dll > exports.txt
          python make_def.py exports.txt obs.def obs.dll
          lib /def:obs.def /machine:x64 /out:obs.lib
          dumpbin /EXPORTS w32-pthreads.dll > pexports.txt
          python make_def.py pexports.txt w32-pthreads.def w32-pthreads.dll
          lib /def:w32-pthreads.def /machine:x64 /out:w32-pthreads.lib
      - name: Stub obsconfig.h
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path genhdr | Out-Null
          @"
          #pragma once
          #define OBS_VERSION "31.0.0"
          #define OBS_VERSION_CANONICAL "31.0.0"
          #define OBS_DATA_PATH "../../data"
          #define OBS_INSTALL_PREFIX ""
          #define OBS_PLUGIN_DESTINATION "obs-plugins"
          #define OBS_RELATIVE_PREFIX "../../"
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          "@ | Set-Content genhdr/obsconfig.h
      - name: Locate zlib static lib (name varies by vcpkg version)
        shell: cmd
        run: |
          dir %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlib.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlib.lib zlib.lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlibstatic.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlibstatic.lib zlib.lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\z.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\z.lib zlib.lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zs.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zs.lib zlib.lib
          if not exist zlib.lib (echo NO ZLIB VARIANT FOUND & exit /b 1)
      - name: Compile plugin DLL
        shell: cmd
        run: |
          clang-cl /nologo /O2 /MT /std:c17 /LD plugin.c ^
            /I obs-studio\libobs /I genhdr ^
            /I %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\include ^
            /Fe:obs-streamtranslate.dll ^
            /link /LIBPATH:%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib /LIBPATH:. ^
            obs.lib w32-pthreads.lib websockets.lib libssl.lib libcrypto.lib libuv.lib zlib.lib ^
            ws2_32.lib crypt32.lib bcrypt.lib user32.lib advapi32.lib iphlpapi.lib userenv.lib secur32.lib psapi.lib ole32.lib shell32.lib dbghelp.lib Synchronization.lib
      - name: Test Windows packaging
        run: python tests/windows-package.test.py
      - name: Compile Windows update-process regression
        shell: cmd
        run: |
          cl /nologo /O2 tests/update-fast-helper.c /Fe:update-fast-helper.exe
          clang-cl /nologo /O2 /MT /std:c17 tests/windows-update-drain-harness.c ^
            /I obs-studio\libobs /I genhdr ^
            /I %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\include ^
            /Fe:windows-update-drain.exe ^
            /link /LIBPATH:%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib /LIBPATH:. ^
            obs.lib w32-pthreads.lib websockets.lib libssl.lib libcrypto.lib libuv.lib zlib.lib ^
            ws2_32.lib crypt32.lib bcrypt.lib user32.lib advapi32.lib iphlpapi.lib userenv.lib secur32.lib psapi.lib ole32.lib shell32.lib dbghelp.lib Synchronization.lib
      - name: Verify Windows final pipe-byte drain
        shell: pwsh
        run: |
          $env:PATH = "$PWD\obs-win\bin\64bit;$env:PATH"
          & .\windows-update-drain.exe "$PWD\update-fast-helper.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://curl.se/ca/cacert.pem" -OutFile cacert.pem
          python scripts/package-windows.py --dll obs-streamtranslate.dll --certificates cacert.pem --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-windows-x64
          path: |
            dist/StreamTranslate-OBS-Plugin-Windows.zip
            dist/StreamTranslate-OBS-Plugin-Windows-OBS32-Portable.zip
