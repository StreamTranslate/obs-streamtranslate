name: Build OBS plugin
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libobs-dev libwebsockets-dev libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-linux
          path: build/obs-streamtranslate.so

  build-macos:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
      MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
      MACOS_APPLICATION_IDENTITY: ${{ vars.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
      MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/streamtranslate-signing.keychain-db
      NOTARY_KEYCHAIN_PROFILE: streamtranslate-notary
    steps:
      - uses: actions/checkout@v4
      - name: Import approved signing identities
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Signing requires the trusted main branch'; exit 1; }
          : "${SIGNING_P12_BASE64:?Signing certificate secret missing}"
          : "${SIGNING_P12_PASSWORD:?Signing password secret missing}"
          : "${NOTARY_APPLE_ID:?Notarization Apple ID missing}"
          : "${NOTARY_APP_PASSWORD:?Notarization password missing}"
          : "${MACOS_TEAM_ID:?Signing team missing}"
          : "${MACOS_APPLICATION_IDENTITY:?Application identity missing}"
          : "${MACOS_INSTALLER_IDENTITY:?Installer identity missing}"
          umask 077
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$MACOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH"
          DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$MACOS_KEYCHAIN_PATH" "$DEFAULT_KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$MACOS_KEYCHAIN_PATH" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH" >/dev/null
          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" --keychain "$MACOS_KEYCHAIN_PATH" --apple-id "$NOTARY_APPLE_ID" --team-id "$MACOS_TEAM_ID" --password "$NOTARY_APP_PASSWORD"
          rm -f "$RUNNER_TEMP/signing.p12"
      - name: Install dependencies
        run: brew install libwebsockets pkg-config simde
      - name: Fetch pinned macOS 14-compatible bundled libraries
        run: |
          curl -fL --retry 3 -o previous.pkg \
            https://github.com/StreamTranslate/obs-streamtranslate/releases/download/v0.1.6/StreamTranslate-OBS-Plugin.pkg
          echo 'b906091c450e419476a32a00bfa66d6ec7ceea82f5db756d2808f3e26214b274  previous.pkg' | shasum -a 256 -c -
          pkgutil --expand-full previous.pkg previous-pkg
          mkdir -p dist/obs-streamtranslate.plugin/Contents/Frameworks
          cp previous-pkg/component.pkg/Payload/Library/Application\ Support/StreamTranslate/obs-streamtranslate.plugin/Contents/Frameworks/*.dylib \
            dist/obs-streamtranslate.plugin/Contents/Frameworks/
      - name: Fetch libobs headers
        run: git clone --depth 1 --branch 32.2.2 https://github.com/obsproject/obs-studio.git
      - name: Compile plugin bundle
        run: |
          mkdir -p dist/obs-streamtranslate.plugin/Contents/MacOS
          mkdir -p genhdr
          cat > genhdr/obsconfig.h << 'HDR'
          #pragma once
          #define OBS_VERSION "32.2.2"
          #define OBS_VERSION_CANONICAL "32.2.2"
          #define OBS_DATA_PATH "../../data"
          #define OBS_INSTALL_PREFIX ""
          #define OBS_PLUGIN_DESTINATION "obs-plugins"
          #define OBS_RELATIVE_PREFIX "../../"
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          HDR
          clang -bundle -O2 -mmacosx-version-min=14.0 -o dist/obs-streamtranslate.plugin/Contents/MacOS/obs-streamtranslate \
            plugin.c \
            -I obs-studio/libobs \
            -I genhdr \
            -I $(brew --prefix)/include \
            $(pkg-config --cflags --libs libwebsockets) \
            -undefined dynamic_lookup
          cat > dist/obs-streamtranslate.plugin/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>obs-streamtranslate</string>
            <key>CFBundleIdentifier</key><string>live.streamtranslate.obs-plugin</string>
            <key>CFBundleExecutable</key><string>obs-streamtranslate</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleVersion</key><string>0.1.8</string>
          </dict>
          </plist>
          PLIST
      - name: Bundle CA certificates
        run: |
          mkdir -p dist/obs-streamtranslate.plugin/Contents/Resources
          curl -sSL -o dist/obs-streamtranslate.plugin/Contents/Resources/cacert.pem https://curl.se/ca/cacert.pem
      - name: Link pinned macOS 14-compatible libraries
        run: |
          BIN=dist/obs-streamtranslate.plugin/Contents/MacOS/obs-streamtranslate
          FW=dist/obs-streamtranslate.plugin/Contents/Frameworks
          LWS=$(otool -L "$BIN" | awk '/libwebsockets/ {print $1}')
          install_name_tool -change "$LWS" '@loader_path/../Frameworks/libwebsockets.22.dylib' "$BIN"
          for lib in "$BIN" "$FW"/*.dylib; do
            minos=$(otool -l "$lib" | awk '/LC_BUILD_VERSION/{seen=1} seen && /minos/{print $2; exit}')
            test "$minos" = '14.0' || { echo "Unsupported minimum $minos: $lib"; exit 1; }
          done
          codesign --force --sign - "$FW"/*.dylib "$BIN"
          echo "--- final link check ---"
          otool -L "$BIN"
          otool -L "$FW/libwebsockets.22.dylib"
      - name: Sign plugin with Developer ID
        if: env.MACOS_SIGNING_ENABLED == 'true'
        run: bash scripts/macos-sign.sh dist/obs-streamtranslate.plugin
      - name: Build branded .pkg installer
        run: |
          # OBS on Apple Silicon ONLY scans ~/Library/Application Support/obs-studio/plugins
          # (the /Library system path is Intel-legacy, compiled out on arm64 — see
          # OBSBasic.cpp AddExtraModulePaths). Payload lands in a neutral spot and a
          # postinstall script copies it into the logged-in user's home plugins dir.
          mkdir -p "pkgroot/Library/Application Support/StreamTranslate" out scripts
          cp -R dist/obs-streamtranslate.plugin "pkgroot/Library/Application Support/StreamTranslate/"
          cat > scripts/postinstall << 'SCRIPT'
          #!/bin/bash
          loggedInUser=$(stat -f%Su /dev/console)
          [ -z "$loggedInUser" ] || [ "$loggedInUser" = "root" ] && loggedInUser=$(ls -l /dev/console | awk '{print $3}')
          userHome=$(dscl . -read "/Users/$loggedInUser" NFSHomeDirectory | awk '{print $2}')
          dest="$userHome/Library/Application Support/obs-studio/plugins"
          mkdir -p "$dest"
          rm -rf "$dest/obs-streamtranslate.plugin"
          cp -R "/Library/Application Support/StreamTranslate/obs-streamtranslate.plugin" "$dest/"
          chown -R "$loggedInUser" "$dest/obs-streamtranslate.plugin"
          exit 0
          SCRIPT
          chmod +x scripts/postinstall
          pkgbuild --root pkgroot \
            --identifier live.streamtranslate.obs-plugin \
            --version 0.1.8 \
            --scripts scripts \
            --install-location "/" \
            component.pkg
          productbuild --distribution installer/distribution.xml \
            --resources installer \
            --package-path . \
            out/StreamTranslate-OBS-Plugin.pkg
      - name: Sign, notarize and staple installer
        if: env.MACOS_SIGNING_ENABLED == 'true'
        run: bash scripts/macos-notarize.sh out/StreamTranslate-OBS-Plugin.pkg
      - name: Clean up signing material
        if: always() && env.MACOS_SIGNING_ENABLED == 'true'
        run: |
          security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/signing.p12"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-macos-installer
          path: out/StreamTranslate-OBS-Plugin.pkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install libwebsockets (static)
        run: vcpkg install libwebsockets:x64-windows-static libuv:x64-windows-static zlib:x64-windows-static
        shell: cmd
      - name: Fetch libobs headers
        run: git clone --depth 1 --branch 31.0.3 https://github.com/obsproject/obs-studio.git
        shell: cmd
      - name: Download OBS release (for obs.dll)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/31.0.3/OBS-Studio-31.0.3-Windows.zip" -OutFile obs-win.zip
          Expand-Archive obs-win.zip -DestinationPath obs-win
          Copy-Item obs-win/bin/64bit/obs.dll .
          Copy-Item obs-win/bin/64bit/w32-pthreads.dll .
      - name: Generate obs.lib import library
        shell: cmd
        run: |
          dumpbin /EXPORTS obs.dll > exports.txt
          python make_def.py exports.txt obs.def obs.dll
          lib /def:obs.def /machine:x64 /out:obs.lib
          dumpbin /EXPORTS w32-pthreads.dll > pexports.txt
          python make_def.py pexports.txt w32-pthreads.def w32-pthreads.dll
          lib /def:w32-pthreads.def /machine:x64 /out:w32-pthreads.lib
      - name: Stub obsconfig.h
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path genhdr | Out-Null
          @"
          #pragma once
          #define OBS_VERSION "31.0.0"
          #define OBS_VERSION_CANONICAL "31.0.0"
          #define OBS_DATA_PATH "../../data"
          #define OBS_INSTALL_PREFIX ""
          #define OBS_PLUGIN_DESTINATION "obs-plugins"
          #define OBS_RELATIVE_PREFIX "../../"
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          "@ | Set-Content genhdr/obsconfig.h
      - name: Locate zlib static lib (name varies by vcpkg version)
        shell: cmd
        run: |
          dir %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlib.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlib.lib zlib.lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlibstatic.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zlibstatic.lib zlib.lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\z.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\z.lib zlib.lib
          if exist %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zs.lib copy %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib\zs.lib zlib.lib
          if not exist zlib.lib (echo NO ZLIB VARIANT FOUND & exit /b 1)
      - name: Compile plugin DLL
        shell: cmd
        run: |
          cl /nologo /O2 /MT /std:c17 /LD plugin.c ^
            /I obs-studio\libobs /I genhdr ^
            /I %VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\include ^
            /Fe:obs-streamtranslate.dll ^
            /link /LIBPATH:%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static\lib /LIBPATH:. ^
            obs.lib w32-pthreads.lib websockets.lib libssl.lib libcrypto.lib libuv.lib zlib.lib ^
            ws2_32.lib crypt32.lib bcrypt.lib user32.lib advapi32.lib iphlpapi.lib userenv.lib secur32.lib psapi.lib ole32.lib shell32.lib dbghelp.lib
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "pkg/obs-plugins/64bit" | Out-Null
          Copy-Item obs-streamtranslate.dll pkg/obs-plugins/64bit/
          Invoke-WebRequest -Uri "https://curl.se/ca/cacert.pem" -OutFile pkg/obs-plugins/64bit/cacert.pem
          Compress-Archive -Path pkg/* -DestinationPath StreamTranslate-OBS-Plugin-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-windows-x64
          path: StreamTranslate-OBS-Plugin-Windows.zip
